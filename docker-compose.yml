services:
  backend:
    build:
      context: ./pyspresso
      dockerfile: Dockerfile
    volumes:
      - ./pyspresso:/app
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./pyspresso/workflows:/app/workflows
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  frontend_node_modules:
